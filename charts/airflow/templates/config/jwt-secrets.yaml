{{- /* NOTE: this Secret is only created when `airflow.jwtSecret` is given a literal value.
       There is deliberately no auto-generated fallback: `randAlphaNum` produces a NEW value on
       every render, and under GitOps the chart is re-rendered on every sync, so an auto-generated
       key would rotate continuously and roll the scheduler and api-server each time. Deployments
       that do not want the key in values should point `airflow.jwtSecretName` at a Secret they
       manage, the same way this chart already handles the fernet and API secret keys.
       `validate-values.tpl` requires one of the two under Airflow 3. */}}
{{- if semverCompare ">=3.0.0" (include "airflow.version" .) }}
{{- if .Values.airflow.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-jwt-secret" (include "airflow.fullname" .) }}
  labels:
    tier: airflow
    component: api-server
    release: {{ .Release.Name }}
    chart: {{ .Chart.Name }}
    heritage: {{ .Release.Service }}
    {{- with .Values.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.airflow.jwtSecretAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  jwt-secret: {{ .Values.airflow.jwtSecret | toString | b64enc | quote }}
{{- end }}
{{- end }}
