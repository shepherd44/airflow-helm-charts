{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "airflow.redis.fullname" . }}
  labels:
    app: {{ include "airflow.labels.app" . }}
    component: redis
    chart: {{ include "airflow.labels.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "airflow.labels.app" . }}
    component: redis
    release: {{ .Release.Name }}
  ports:
    - name: redis
      ## NOTE: redis should be treated as opaque TCP (only important for Istio users)
      appProtocol: tcp
      protocol: TCP
      port: 6379
{{- end }}
